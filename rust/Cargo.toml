[workspace]
resolver = "3"
members = [
    "crates/mc-math",
    "crates/mc-nbt",
    "crates/mc-data",
    "crates/mc-world",
    "crates/mc-worldgen",
    "crates/mc-proto",
    "crates/mc-server",
    "crates/mc-oracle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mc-math = { path = "crates/mc-math" }
mc-nbt = { path = "crates/mc-nbt" }
mc-data = { path = "crates/mc-data" }
mc-world = { path = "crates/mc-world" }
mc-worldgen = { path = "crates/mc-worldgen" }
mc-proto = { path = "crates/mc-proto" }
mc-oracle = { path = "crates/mc-oracle" }

anyhow = "1"
base64 = "0.22"
bytes = "1"
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
lz4_flex = "0.11"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v3", "v4", "serde"] }
aes = "0.8"
rsa = { version = "0.9", features = ["sha1"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
